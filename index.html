"},how:{h2:"How a trade works",steps:[{t:"Contact the desk",d:"Tell us what you want to buy or sell, and how much."},{t:"We verify who you are",d:"We check your identity before the first trade. Companies also send company documents. The identity check is done with iDenfy."},{t:"We agree on the price",d:"We send you one fixed price. Nothing happens until you accept it."},{t:"You send your part",d:"You send BAM or EUR in your own name, or stablecoins from a wallet you have confirmed as yours. We do not accept cash or payments from other people."},{t:"We send our part",d:"We send the stablecoins to your wallet, or we send you the BAM or EUR. You get a written confirmation."}]},checks:{h2:"Checks on every client and every trade",items:[{t:"Identity first",d:"No client trades before we have verified their identity. We use iDenfy to check identity documents and to match the face to the photo on the document."},{t:"Every trade is checked",d:"We check each transaction and each wallet under the rules against money laundering and terrorist financing."},{t:"We report when the law requires it",d:"We report suspicious transactions to the Financial Intelligence Department, as the law requires."},{t:"We keep records",d:"We keep records of clients and trades for as long as the law requires."}],notTitle:"What Vesk does not do",not:["No trading platform and no order book.","No investment advice.","No cash."]},risk:{h2:"Risk warning",p:["Republika Srpska, the Securities Commission of Republika Srpska and other public bodies do not guarantee the value of virtual currencies. They are not liable for any damage or loss that users, holders, service providers or other persons suffer from transactions in virtual currencies.","Transactions in virtual currencies carry risk. You can lose part or all of your money or other assets. The rules on deposit insurance and the rules on the protection of users of financial services do not apply to these transactions."],ref:"Law on the Securities Market of Republika Srpska, Article 260b."},faq:{h2:"Questions",items:[{q:"Is Vesk registered?",a:"Not yet. Vesk is in the process of registration with the Securities Commission of Republika Srpska. We will start to offer services after registration."},{q:"Is there a platform to log into?",a:"No. There is no app and no online account. You deal directly with our desk, and every trade is confirmed in writing."},{q:"Who can become a client?",a:"Companies and individuals who pass our identity and compliance checks."},{q:"How is the price set?",a:"We give you one fixed price for your trade. The price includes our margin. You see the full price before you decide."},{q:"What do I need to start?",a:"A valid identity document. Companies also need company documents and details of their beneficial owners. If you want to receive stablecoins yourself, you need a wallet that you control."}]},contact:{h2:"Contact the desk",lead:"Tell us what you need. A person from Vesk will answer you.",name:"Full name",company:"Company",email:"Email",phone:"Phone",optional:"optional",interest:"What do you need?",interests:{buy:"Buy stablecoins",sell:"Sell stablecoins",custody:"Custody",other:"Something else"},message:"Message",consent:"I agree that Vesk uses these details to answer my enquiry.",privacy:"Privacy notice",send:"Send message",sending:"Sending",sentTitle:"Message sent.",sentBody:"We will answer you by email.",again:"Send another message",errName:"Enter your name.",errEmail:"Enter a valid email address.",errConsent:"Tick the box to continue.",errSend:"The message was not sent. Check your connection and try again.",preview:"Preview: this form is not connected yet. Nothing is sent."},footer:{line:"Stablecoin OTC and digital asset custody. Bosnia and Herzegovina.",privacy:"Privacy notice",risk:"Risk warning",rights:"© 2026 Vesk. All rights reserved."},privacy:{h1:"Privacy notice",back:"Back to the website",items:[{t:"Who we are",d:"Vesk is the controller of the personal data you send through this website."},{t:"What we collect",d:"The details you enter in the contact form: your name, company, email, phone and message."},{t:"Why we collect it",d:"To answer your enquiry. The legal basis is your consent."},{t:"How long we keep it",d:"Only as long as we need it to answer you, unless the law requires us to keep it longer."},{t:"Who else can see it",d:"The providers of our website hosting and contact form process the data for us. We do not sell your data."},{t:"Your rights",d:"You can ask to see, correct or delete your data. You can withdraw your consent at any time. Use the contact form for this. You can also complain to the Personal Data Protection Agency in Bosnia and Herzegovina."},{t:"Cookies",d:"This website does not use tracking cookies. It only remembers your language choice in your browser."}]},soon:{title:"Vesk: coming soon",h1:"Vesk is coming soon.",lead:"Vesk will be an OTC desk for USDT and USDC, with custody for digital assets. We will trade in BAM and EUR.",status:"Vesk is in the process of registration with the Securities Commission of Republika Srpska. We do not offer services yet.",formTitle:"Leave your details. We will contact you when we open.",send:"Send",privacyShort:"We use these details only to contact you. You can ask us to delete them at any time.",footerLine:"Stablecoin OTC and digital asset custody. Bosnia and Herzegovina.",rights:"© 2026 Vesk. All rights reserved."}},Cx={langName:"Srpski",title:"Vesk: OTC trgovina stabilnim kriptovalutama i čuvanje digitalne imovine",status:"Postupak upisa Veska u evidenciju kod Komisije za hartije od vrijednosti Republike Srpske je u toku. Pružanje usluga još nije počelo.",statusShort:"U postupku upisa u evidenciju. Usluge još ne pružamo.",nav:{services:"Usluge",pairs:"Parovi",how:"Kako funkcioniše",checks:"Provjere",questions:"Pitanja",contact:"Kontaktirajte desk",menu:"Meni",close:"Zatvori"},hero:{h1:"Kupovina, prodaja i čuvanje stabilnih kriptovaluta.",lead:"Vesk pruža usluge direktne kupovine i aju i dokumentaciju firme. Provjera identiteta se obavlja preko servisa iDenfy."},{t:"Dogovaramo cijenu",d:"Šaljemo Vam jednu fiksnu cijenu. Ništa se ne dešava dok je ne prihvatite."},{t:"Vi šaljete svoj dio",d:"Šaljete BAM ili EUR u svoje ime ili stabilne kriptovalute sa novčanika za koji ste potvrdili da je Vaš. Ne primamo gotovinu ni uplate trećih lica."},{t:"Mi šaljemo svoj dio",d:"Šaljemo stabilne kriptovalute na Vaš novčanik ili Vam šaljemo BAM ili EUR. Dobijate pismenu potvrdu."}]},checks:{h2:"Provjeravamo svakog klijenta i svaku razmjenu",items:[{t:"Prvo identitet",d:"Nijedan klijent ne trguje prije nego što provjerimo njegov identitet. Za provjeru ličnih isprava i poređenje lica sa fotografijom na ispravi koristimo iDenfy."},{t:"Svaka razmjena se provjerava",d:"Svaku transakciju i svaki novčanik provjeravamo u skladu sa propisima o sprečavanju pranja novca i finansiranja terorističkih aktivnosti."},{t:"Prijavljujemo kada zakon to nalaže",d:"Sumnjive transakcije prijavljujemo Finansijsko-obavještajnom odjeljenju, u skladu sa zakonom."},{t:"Čuvamo evidencije",d:"Evidencije o klijentima i razmjenama čuvamo onoliko dugo koliko zakon nalaže."}],notTitle:"Šta Vesk ne radi",not:["Nema platforme za trgovanje ni knjige naloga.","Ne dajemo investicione savjete.","Ne primamo gotovinu."]},risk:{h2:"Upozorenje o rizicima",p:["Republika Srpska, Komisija za hartije od vrijednosti Republike Srpske i drugi organ javnog sektora ne garantuju za vrijednost virtuelnih valuta i ne snose odgovornost za bilo koju eventualnu štetu i gubitke koje korisnici i drugi imaoci virtuelnih valuta ili lica koja pružaju usluge povezane sa virtuelnim valutama, odnosno treća lica, pretrpe u vezi sa obavljanjem transakcija sa virtuelnim valutama.","Obavljanje transakcija sa virtuelnim valutama nosi rizike, uključujući rizik od djelimičnog ili potpunog gubitka novčanih sredstava, odnosno druge imovine. Na transakcije sa virtuelnim valutama ne primjenjuju se propisi kojima se uređuje osiguranje de
